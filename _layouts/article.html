<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | Saim Sunny</title>
<meta name="description" content="{{ page.summary | default: page.excerpt | strip_html | strip_newlines | truncate: 150 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="{{ page.title }} | Saim Sunny">
<meta property="og:description" content="{{ page.summary | default: page.excerpt | strip_html | strip_newlines | truncate: 150 }}">
<meta property="og:image" content="https://saimsunny.net/saim.jpg">
<link rel="stylesheet" href="/style.css?v=7">
</head>
<body>
{% include header.html %}
<main>
  <article class="post">
    <p class="label"><a href="/articles.html">&larr; Articles</a> &middot; {{ page.date | date: "%-d %B %Y" }}{% if page.tag %} &middot; {{ page.tag }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
    {% if page.image %}<img class="cover" src="{{ page.image }}" alt="">{% endif %}
    <div class="body">
{{ content }}
    </div>
  </article>
</main>

{% include footer.html %}
</body>
</html>
